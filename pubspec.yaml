name: audioplayer
description: Swara - a Telugu-first Indian music player with online streaming and offline downloads.
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  audio_metadata_reader: ^1.8.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^4.0.5
  connectivity_plus: ^7.3.2
  file_picker: ^13.3.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  http: ^1.6.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  flutter_cache_manager: ^3.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/artwork/

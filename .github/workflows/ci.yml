name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      # No key.properties in CI, so this APK is signed with the debug key.
      # Official releases are signed locally and attached to GitHub Releases.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: swara-apk
          path: build/app/outputs/flutter-apk/app-release.apk
